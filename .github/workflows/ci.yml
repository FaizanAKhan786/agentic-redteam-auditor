name: Tests and audit smoke check
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit and isolated end-to-end tests
        run: python -m pytest tests/ -q --junitxml=unit-test-results.xml
      - name: Verify simulated audit CLI
        run: |
          python -m auditor.orchestrator --demo --output ci-audit-reports
          test -n "$(find ci-audit-reports -maxdepth 1 -name '*.md' -print -quit)"
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-unit-test-results
          path: unit-test-results.xml
          if-no-files-found: ignore
